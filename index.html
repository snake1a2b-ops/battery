<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #333; }
        p { color: #666; font-size: 1.1em; }
        .info {
            font-weight: bold;
            color: #007bff;
            background: #e7f1ff;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello World</h1>
        <p>Your public network details as detected by the browser:</p>
        <div id="ip-display" class="info">Loading connection data...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
